[keybind]
user_command_view_toggle_1 = ["d"]

[core.user_command]
commands_1 = { name = "delta diff", commands = ["sh", "-c", "git --no-pager diff --color=always {{first_parent_hash}} {{target_hash}} | delta --paging=never"] }

[ui.detail]
height = 12

[ui.user_command]
height = 10

[graph.color]
branches = [
  "#58a6ff",
  "#3fb950",
  "#d29922",
  "#bc8cff",
  "#db6d28",
  "#db61a2",
]
edge = "#303030"
background = "#000000"

[color]
# non-selected baseline
fg = "#e6edf3"
bg = "#000000"

# selected rows: bright + plate + bold
list_selected_fg = "#ffffff"
list_selected_bg = "#101010"
list_selected_bold = true
list_selected_italic = false

# selected refs follow same rule
ref_selected_fg = "#ffffff"
ref_selected_bg = "#101010"
ref_selected_bold = true
ref_selected_italic = false

# list text stays BASE, not dim
list_subject_fg = "#e6edf3"
list_name_fg    = "#58a6ff"
list_hash_fg    = "#d29922"
list_date_fg    = "#79c0ff"

# match highlight remains readable
list_match_fg = "#000000"
list_match_bg = "#d29922"

# ref indicators
list_ref_paren_fg         = "#d29922"
list_ref_branch_fg        = "#3fb950"
list_ref_remote_branch_fg = "#f85149"
list_ref_tag_fg           = "#d29922"
list_ref_stash_fg         = "#bc8cff"
list_head_fg              = "#58a6ff"

# detail panel
detail_email_fg              = "#58a6ff"
detail_ref_branch_fg         = "#3fb950"
detail_ref_remote_branch_fg  = "#f85149"
detail_ref_tag_fg            = "#d29922"
detail_file_change_add_fg    = "#3fb950"
detail_file_change_modify_fg = "#d29922"
detail_file_change_delete_fg = "#f85149"
detail_file_change_move_fg   = "#bc8cff"

# status + misc
status_input_fg           = "#e6edf3"
status_input_transient_fg = "#484f58"
status_info_fg            = "#79c0ff"
status_success_fg         = "#3fb950"
status_warn_fg            = "#d29922"
status_error_fg           = "#f85149"
virtual_cursor_fg         = "#58a6ff"
help_block_title_fg       = "#3fb950"
help_key_fg               = "#d29922"

# chrome
divider_fg = "#303030"
